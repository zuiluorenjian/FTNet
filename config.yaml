
data:
  test_data_root: 
 
  train_data_root:   # 训练数据路径
  datasets: ['ADM','BigGAN','glide','Midjourney','SD','VQDM']
  multiclass: [0, 0, 0, 0, 0, 0]
 #['adm','ddpm','iddpm','pndm','sdv1_new','sdv2','vqdiffusion']
 #['DALLE','ddpm','guided-diffusion','improved-diffusion','midjourney']
# 模型配置
model:
  backbone: 'ViT-L/14'  # CLIP模型架构
  device: 'cuda'        # 设备
  download_root:   # 模型下载路径

# CLIP特征提取配置
clip_layer: 12                  


# Cache配置
cache:
  cache_dir: './cache_deepfake'
  shots_per_class: 2    
  augment_epochs: 3    
  load_cache: False     # 是否从文件加载cache
  
patch_matching:
  patch_size: 56  # 每个 patch 的像素大小（例如，224x224 图像分割为 4x4 网格）
  num_patches: 16  # patch 总数（自动计算为 (224 / patch_size)^2）
# TIP-Adapter超参数
hyperparams:
  init_beta: 1.0        
  init_alpha: 1.0       
  search_hp: False         
  search_steps: 5       # 每个参数的搜索步数（从30降到5以加速）
training:
  epochs: 20            # 训练轮数
  learning_rate: 0.001  # 学习率
  batch_size: 32        # 训练批大小
  weight_decay: 1e-4    # 权重衰减
  scheduler: 'cosine'   # 学习率调度器类型


# 评估配置
evaluation:
  batch_size: 64      
  save_results: true
  results_file: ''

# 日志配置
logging:
  verbose: true         # 是否显示详细日志
  save_cache: true


